# Native Liquid Glass is composed by AppKit/SwiftUI behind the Metal surface.
# Zero grid padding keeps the presentation bridge aligned with terminal cells.
background = 19191e
foreground = e9e9ef
background-opacity = 0.12
background-opacity-cells = true
background-blur = macos-glass-clear
window-padding-x = 0
window-padding-y = 0
window-padding-balance = false
macos-titlebar-style = transparent
window-theme = dark
# The primary sidebar remains fully readable while another tab group is focused.
unfocused-split-opacity = 1
